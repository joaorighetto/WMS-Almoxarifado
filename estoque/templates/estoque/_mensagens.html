{% comment %}
Feedback de `django.contrib.messages` — mesmo padrão de
`catalogo/templates/catalogo/_mensagens.html` (DESIGN.md → Components →
Alert).
{% endcomment %}
{% if messages %}
<div class="estoque-messages">
  {% for message in messages %}
  <div
    class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}"
    role="alert"
  >
    <p>{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% endif %}
